# 1. Cài đặt Node.js 22 (Phiên bản mới nhất, tương thích tốt nhất)
[phases.setup]
nixPkgs = ["nodejs_22"]

# 2. Cài đặt thư viện (Xóa sạch cache cũ để tránh lỗi binding)
[phases.install]
cmds = [
    "rm -rf node_modules package-lock.json", # Xóa file cũ
    "npm install"                            # Cài mới tinh
]

# 3. Build Project
[phases.build]
cmds = ["npm run build"]

# 4. Khởi chạy
[start]
cmd = "node .output/server/index.mjs"
