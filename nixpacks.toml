# 1. Cài đặt CẢ Bun (để install) và Node.js (để run)
[phases.setup]
nixPkgs = ["bun", "nodejs_22"]

# 2. Dùng Bun để cài đặt thư viện (Nhanh và fix lỗi native binding)
[phases.install]
cmds = [
    "rm -rf node_modules package-lock.json pnpm-lock.yaml", # Xóa sạch cũ
    "bun install --no-save"                                 # Cài bằng Bun
]

# 3. Build Project bằng Bun
[phases.build]
cmds = ["bun run build"]

# 4. Khởi chạy bằng Node (Ổn định nhất cho Nuxt)
[start]
cmd = "node .output/server/index.mjs"
