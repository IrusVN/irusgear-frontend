# 1. Cài đặt Node.js 22 và pnpm (Công cụ cài đặt nhanh và ổn định hơn npm)
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

# 2. Xóa sạch cache cũ và cài đặt lại từ đầu (Quan trọng!)
[phases.install]
cmds = [
    "rm -rf node_modules package-lock.json pnpm-lock.yaml", # Xóa sạch dấu vết cũ
    "pnpm install --shamefully-hoist --no-optional"         # Cài đặt chế độ tương thích cao
]

# 3. Build Project
[phases.build]
cmds = ["pnpm run build"]

# 4. Khởi chạy
[start]
cmd = "node .output/server/index.mjs"
