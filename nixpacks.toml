# 1. Cài đặt Node.js 22 và pnpm
[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

# 2. Cài đặt thư viện bằng pnpm (Mạnh mẽ hơn npm)
[phases.install]
cmds = [
    "pnpm install --frozen-lockfile=false" # Bỏ qua lockfile lỗi, tự giải quyết dependency
]

# 3. Build Project
[phases.build]
cmds = ["pnpm run build"]

# 4. Khởi chạy
[start]
cmd = "node .output/server/index.mjs"
