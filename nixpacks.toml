# 1. Cài đặt Node.js 22
[phases.setup]
nixPkgs = ["nodejs_22"]

# 2. Cài đặt thư viện (Cực mạnh tay: Xóa sạch & Bỏ qua optional)
[phases.install]
cmds = [
    "rm -rf node_modules package-lock.json",
    "npm install --no-optional --legacy-peer-deps"
]

# 3. Build Project
[phases.build]
cmds = ["npm run build"]

# 4. Khởi chạy
[start]
cmd = "node .output/server/index.mjs"
